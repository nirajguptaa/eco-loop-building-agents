# Eco-Loop Building Agents — config
# Change `mode` to switch Development <-> Production without touching code.
mode: development   # development | production
demo_mode: false     # true = replay cached LLM decisions for deterministic demo video

llm:
  # Any OpenAI-compatible endpoint works here: Groq, Together AI, OpenRouter, Ollama (local).
  # Only these three fields change when switching providers.
  base_url: "https://api.groq.com/openai/v1"
  api_key_env: "LLM_API_KEY"      # name of the env var holding the key (never hardcode keys)
  model: "llama-3.3-70b-versatile"

comfort:
  min_temp_c: 20
  max_temp_c: 26
  setpoint_min_c: 18
  setpoint_max_c: 28

loop:
  max_iterations: 96     # e.g. 15-min timesteps over 24h for a demo run
  timestep_minutes: 15

paths:
  mock_metrics_csv: "data/mock_metrics.csv"
  demo_transcript: "data/demo_transcript.jsonl"
  ai_log_output: "data/ai_run_log.jsonl"
  baseline_log_output: "data/baseline_run_log.jsonl"
  summary_output: "data/savings_summary.json"

baseline:
  # Fixed setpoint a traditional rule-based BMS would use — the
  # comparison point for "energy efficiency realized" scoring.
  fixed_setpoint_c: 23
  fixed_lighting_pct: 80
  fixed_ventilation: "medium"

agent:
  # Setpoint changes smaller than this (Celsius) are treated as noise,
  # not a real decision, and snapped back to the previous setpoint.
  # Tune this after observing real LLM behavior in ai_run_log.jsonl.
  min_meaningful_change_c: 0.3